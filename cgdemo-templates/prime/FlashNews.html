<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Sequence Player with Animated Ticker</title>
    <link rel="stylesheet" href="assets/css/quantum.css">
    <style>
        #flashNews{
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="animationCanvas"></canvas>
        <canvas id="flashNews"></canvas>
        <div class="flash-news-center">
            <p class="animated-text nepali-font-Arab" style="color: blue;"></p>
        </div>
    </div>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="assets/js/sequenceImages.js"></script>
    <script src="assets/js/gsapAnimation.js"></script>
    <script src="assets/js/quantum.js"></script>

    <script>
        

    const canvas = document.getElementById('animationCanvas');
    const flashCanvas = document.getElementById('flashNews');

    

        playImageSequenceAnimation(
                    flashCanvas, 
                    'assets/FlashNews/FlashFront/', 
                    56, 
                    60, 
                    'New_Flash_News_Lower_Third_{index}', 
                    '.png', 
                    5, 
                    0, 
                    false, // No loop
                    false, // Do not hold the last frame
                    () => {
   
        
                        createTicker({
                                apiUrl: 'https://quantumcg.simulcast.com.np/api_data/data.php?content=flash&token=asfhoasfajefaskdfhlashflkhauwehfwui32423kshdafaheaf&company=3',
                                textSelector: '.animated-text',
                                animationConfig: {
                                    scaleStart: 4,
                                    scaleEnd: 1,
                                    opacityStart: 0,
                                    opacityEnd: 1,
                                    duration: 1200,
                                    delayMultiplier: 40
                                },
                                textAnimationName: 'animation-35',
                                dataSourceKey: 'brk_text',
                                playImageSequence: (onComplete) => {
                                playImageSequenceAnimation(
                                    flashCanvas, 
                                    'assets/FlashNews/FlashFront/', 
                                    56, 
                                    60, 
                                    'New_Flash_News_Lower_Third_{index}', 
                                    '.png', 
                                    5, 
                                    0, 
                                    false, // No loop
                                    false, // Do not hold the last frame
                                    onComplete // Call onComplete after animation
                                );
                            },
                            loop: true, // Enable continuous looping
                            });

                    }
                );
                playImageSequenceAnimation(
        canvas, 
        'assets/FlashNews/FlashBack/', 
        195, 
        50, 
        'New_Flash_News_Lower_Third_{index}', 
        '.png', 
        5, 
        56
    );













    </script>
</body>
</html>

<body>
    <div class="livePlate">
        <canvas id="animationCanvas"></canvas>
        <p class="livePlateText nepali-font-Arab">hGtf hfGg rfxG5</p>
    </div>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
     
        async function fetchCustomData() {
    const url = "http://localhost/sajilo_cg/api_data/data.php?content=customData&token=aYa0cffyuyu7JneRJoY1kX8d3YMRhP&company=2&collection=livetext&value=livetxt";

    try {
        const response = await fetch(url);
        const data = await response.json();
        
        console.log("API Response:", data);

        // Check if response has data
        if (Array.isArray(data) && data.length > 0) {
            // Get all elements with class "livePlateText"
            const elements = document.getElementsByClassName("livePlateText");

            // Update text content for all elements
            for (let i = 0; i < elements.length; i++) {
                elements[i].textContent = data[0]; // Set the first value from the array
            }
            animateTextContent('.livePlateText', 'animation-26', { loop: true }); // Animate text with class `.my-text` using `fadeAnimation` in a loop
        } else {
            console.warn("No data found in API response.");
        }
    } catch (error) {
        console.error("Error fetching data:", error);
    }
}

// Call the function when needed
fetchCustomData();




    const canvas = document.getElementById('animationCanvas');


                playImageSequenceAnimation(
        canvas, 
        'assets/Live_Plate/', 
        126, 
        25, 
        'Live_Plate_{index}'
    );














    </script>
</body>

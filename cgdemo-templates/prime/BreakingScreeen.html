<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Sequence Player with Animated Ticker</title>
    <link rel="stylesheet" href="assets/css/quantum.css">
    <link rel="stylesheet" href="assets/css/fullBreaking.css">
</head>
<body >
    <div class="livePlate">
        <canvas id="animationCanvas"></canvas>
        <p class="livePlateText nepali-font-Arab"></p>
    </div>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="assets/js/sequenceImages.js"></script>
    <script src="assets/js/gsapAnimation.js"></script>
    <script src="assets/js/quantum.js"></script>

    <script>
       const canvas = document.getElementById('animationCanvas');
   

    function startBreakingNewsSequence() {


     playImageSequenceAnimation(
            canvas, 
            'assets/BreakingScreen/', 
            463, 
            50, 
            'Breaking_News_Full_Screen-01_{index}', 
            '.png', 
            5, 
            0, 
            false,  // Main sequence does not loop
            false,   // Do not hold the last frame
            () => { 
                console.log("Main animation completed!");
            },
            40, // Trigger onTrigger at frame 40
            () => {
                // Start ticker after image sequence
                createTicker({
                                apiUrl: 'https://quantumcg.simulcast.com.np/api_data/data.php?content=breaking&token=asfhoasfajefaskdfhlashflkhauwehfwui32423kshdafaheaf&company=3',
                                textSelector: '.livePlateText',
                                animationConfig: {
                                    scaleStart: 4,
                                    scaleEnd: 1,
                                    opacityStart: 0,
                                    opacityEnd: 1,
                                    duration: 1200,
                                    delayMultiplier: 10
                                },
                                textAnimationName: 'animation-38',
                                dataSourceKey: 'brk_text',
                              
                                playImageSequence: (onComplete) => {
                        onComplete();
                    },
                    animationDelay: 2000,
                    onTickerComplete: () => {
                        console.log("Ticker completed, restarting sequence...");
                       window.location.reload();
                    }
                });
            },
            [48, 142]  // Subrange loop after main sequence
        );
    }




    // Start the first sequence
    startBreakingNewsSequence();

    </script>
</body>
</html>
